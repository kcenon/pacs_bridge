name: Documentation

# Builds the MkDocs site with --strict so broken links and bad references fail
# the check. GitHub Pages is not enabled for this repository, so the former
# "Setup Pages" and deploy steps failed on every run that reached them
# (kcenon/pacs_bridge#385) and were removed. To publish the site, enable Pages
# with "GitHub Actions" as the source and add actions/upload-pages-artifact +
# actions/deploy-pages back.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install mkdocs-material
          pip install mkdocs-minify-plugin
          pip install pymdown-extensions

      - name: Build documentation
        run: mkdocs build --strict
